\* Two workers whose clocks may each be a second off, a two-second lease, a
\* five-second deadline and two attempts. Small enough for TLC in seconds,
\* large enough for every ordering of claim, expiry, requeue and reclaim.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  Lease = 2
  Deadline = 5
  MaxAttempts = 2
  Skew = 1
  MaxClaims = 3
  MaxTime = 8
INVARIANTS
  TypeOK
  TokenMatchesStatus
  FenceExclusive
  NoStaleWrite
PROPERTIES
  EndedIsFinal
  WatchdogGivesUpLast
  CrashedHolderIsReclaimed
