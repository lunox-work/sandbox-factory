# Rendered at container start: ${API_URL} is substituted by the nginx image's
# entrypoint, so the same image can point at any API.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Proxied so the browser sees one origin, matching the Vite dev proxy, so
    # cookie and CORS behaviour is the same in development and production.
    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # So a streaming endpoint is not cut off or held back by the proxy.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html. It is never cached, or
    # a deploy would leave stale asset refs.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
