<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunox - Platform</title>

    <!--
      Served from public/brand/, which Vite copies into dist/ verbatim. The ICO
      is listed first with sizes="any" for browsers that ignore the SVG; those
      that support it prefer the SVG, which stays sharp at any density.
    -->
    <link rel="icon" href="/brand/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/favicon/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/brand/favicon/favicon-32x32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="/brand/favicon/favicon-16x16.png"
      sizes="16x16"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      href="/brand/app-icons/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <meta name="theme-color" content="#1868DB" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
