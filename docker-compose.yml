# Local development and production-style services, in two profiles:
#
#   dev   source bind-mounted, hot reload, container-own node_modules.
#         `make up`.
#   prod  multi-stage builds, nothing mounted, nginx serving the built web app.
#         `make up-prod`.
#
# Postgres and SeaweedFS have no profile, so they start in both, and alone with
# `make db-up`. The API has no in-memory fallback and will not boot without
# Postgres. The VS Code extension is host-only (`make ext-watch`).

services:
  postgres:
    image: postgres:17-alpine
    container_name: sandbox-factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sandbox_factory
    ports:
      # Overridable so this does not fight an existing local Postgres.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Dependants wait on this with `condition: service_healthy`.
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandbox_factory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  seaweedfs:
    # `server` runs master, volume, filer and the S3 gateway in one process:
    # fine for local development and CI, not for a real deployment.
    image: chrislusf/seaweedfs:3.80
    container_name: sandbox-factory-seaweedfs
    restart: unless-stopped
    # A bucket takes 7 volumes when it first stores anything, and the
    # default collection one more. 16 holds the app's bucket beside the one
    # the object-store test makes; at 8 the test finds no volume to write to.
    command: >
      server -dir=/data -s3 -s3.port=8333
      -master.volumeSizeLimitMB=128 -volume.max=16
    environment:
      # Development-only S3 credentials; the API signs with the matching
      # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
      AWS_ACCESS_KEY_ID: sandbox
      AWS_SECRET_ACCESS_KEY: sandboxsecret
    ports:
      # S3 gateway: the only port the API talks to.
      - "${S3_PORT:-8333}:8333"
      # Filer's HTTP browser, for eyeballing uploads. No code uses it.
      - "${SEAWEED_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # Probes the S3 gateway, which comes up last. 127.0.0.1, not localhost:
      # wget tries ::1 first and SeaweedFS does not bind IPv6. No pipe: it
      # would mask wget's exit status.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---- dev ----------------------------------------------------------------

  api-dev:
    profiles: [dev]
    image: node:22-alpine
    container_name: sandbox-factory-api-dev
    working_dir: /repo
    # `node --watch` exits 0 if tsc rewrites dist/server.js while it is booting,
    # and `concurrently -k` then tears the container down. A clean exit would
    # otherwise leave the container down for good and every /api call proxying
    # through Vite returns 502.
    restart: unless-stopped
    # On a fresh clone packages/*/dist does not exist and tsc fails with
    # "Cannot find module 'sandbox-factory'". `^...` builds exactly this
    # workspace's dependencies, in order.
    command: >
      sh -c "npm ci --ignore-scripts
      && npx turbo run build --filter=@sandbox-factory/api^...
      && npm run dev --workspace @sandbox-factory/api"
    environment:
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Required. Host and port are the compose service, not localhost.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sandbox_factory
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-8333}
      S3_BUCKET: sandbox-factory
      S3_ACCESS_KEY_ID: sandbox
      S3_SECRET_ACCESS_KEY: sandboxsecret
      # Real OAuth secrets, never written here: they come from the host
      # environment or the gitignored .env.development (the Makefile passes
      # --env-file). `:-` rather than compose's `:?` guard, which is evaluated
      # for the whole file and would break `make db-up`. An unset value fails
      # in the API's env parsing, with a readable message.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # Browser-facing origin; override locally when using a dev HTTPS proxy.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${API_PORT:-4000}}
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-5173}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      JIRA_CLIENT_ID: ${JIRA_CLIENT_ID:-}
      JIRA_CLIENT_SECRET: ${JIRA_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      MAX_ACTIVE_RUNS_PER_ORG: ${MAX_ACTIVE_RUNS_PER_ORG:-3}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIZING_MODEL: ${SIZING_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SIZING_MODEL: ${DEEPSEEK_SIZING_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - .:/repo
      # Anonymous volumes shadow the bind mount, so the container uses its own
      # node_modules: the host tree holds darwin binaries and symlinks.
      #
      # Every workspace is listed, not only the ones this service runs. The
      # `npm ci` in the command installs the whole workspace tree, and any
      # workspace left off writes its linux binaries through the bind mount
      # into the host's node_modules — after which the host's own build of
      # that workspace fails. A new workspace needs a line here and below.
      - /repo/node_modules
      - /repo/apps/worker/node_modules
      - /repo/apps/api/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/extension/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/github/node_modules
      - /repo/packages/jira/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/client/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  web-dev:
    profiles: [dev]
    image: node:22-alpine
    container_name: sandbox-factory-web-dev
    working_dir: /repo
    # Same dependency build as the API, then Vite. --host 0.0.0.0 because
    # Vite's default of localhost is unreachable from outside the container.
    command: >
      sh -c "npm ci --ignore-scripts
      && npx turbo run build --filter=@sandbox-factory/web^...
      && npm run dev --workspace @sandbox-factory/web -- --host 0.0.0.0"
    environment:
      # The dev server proxies /api here, by service name.
      VITE_API_URL: http://api-dev:4000
      VITE_DEV_ALLOWED_HOSTS: ${VITE_DEV_ALLOWED_HOSTS:-}
      VITE_DEV_CANONICAL_ORIGIN: ${VITE_DEV_CANONICAL_ORIGIN:-}
      # Build provenance, resolved on the host: `node:22-alpine` has no git
      # binary, so the resolver inside would report "unknown". `make up`
      # exports these; a bare `docker compose up` leaves them empty, which the
      # resolver treats as absent.
      BUILD_SHA: ${BUILD_SHA:-}
      BUILD_REF: ${BUILD_REF:-}
      BUILD_DIRTY: ${BUILD_DIRTY:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/repo
      # Every workspace, for the reason given on api-dev.
      - /repo/node_modules
      - /repo/apps/worker/node_modules
      - /repo/apps/api/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/extension/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/github/node_modules
      - /repo/packages/jira/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/client/node_modules
    depends_on:
      - api-dev

  worker:
    profiles: [dev, prod]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    image: sandbox-factory-worker:local
    restart: on-failure
    working_dir: /repo
    command: >
      sh -c 'if [ -z "$$GITHUB_APP_ID" ]; then echo "Worker disabled: GitHub App is not configured"; exit 0; fi; npm ci --ignore-scripts
      && npx turbo run build --filter=@sandbox-factory/worker
      && npm start --workspace @sandbox-factory/worker'
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sandbox_factory
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: sandbox-factory
      S3_ACCESS_KEY_ID: sandbox
      S3_SECRET_ACCESS_KEY: sandboxsecret
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      WORKER_MODE: poll
      # Development only: builds run their baseline as local processes.
      EVALUATION_PROVIDER: local-process
      # The scope and fixtures agents. The key is the one sizing uses; without
      # it agent runs fail with agent_unavailable and nothing else changes.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-}
      MAX_TARBALL_BYTES: ${MAX_TARBALL_BYTES:-209715200}
      MAX_FILES: ${MAX_FILES:-20000}
      # Context builders. DeepWiki-Open is optional: without a URL deepwiki
      # runs fail with builder_unavailable.
      DEEPWIKI_OPEN_URL: ${DEEPWIKI_OPEN_URL:-}
      DEEPWIKI_OPEN_AUTH_CODE: ${DEEPWIKI_OPEN_AUTH_CODE:-}
      DEEPWIKI_OPEN_PROVIDER: ${DEEPWIKI_OPEN_PROVIDER:-}
      DEEPWIKI_OPEN_MODEL: ${DEEPWIKI_OPEN_MODEL:-}
    volumes:
      - .:/repo
      - /repo/node_modules
      - /repo/apps/worker/node_modules
      - /repo/apps/api/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/extension/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/github/node_modules
      - /repo/packages/jira/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/client/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # ---- deepwiki -----------------------------------------------------------
  # The service behind the worker's deepwiki context builder, as a profile of
  # its own: `make deepwiki-up`. DeepWiki-Open writes the wiki with a model
  # and retrieves over embeddings; it has no Anthropic provider, so its
  # LiteLLM provider is pointed at DeepSeek (OpenAI-compatible, the key sizing
  # already uses) and the embeddings come from the Ollama sidecar, which
  # pulls `nomic-embed-text` on first start. The configuration it loads is
  # `apps/worker/deepwiki/`. The worker reaches it as `http://deepwiki:8001`
  # (`DEEPWIKI_OPEN_URL` in .env.development); the web UI is on :3000.
  ollama:
    profiles: [deepwiki]
    image: ollama/ollama:latest
    container_name: sandbox-factory-ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done;
      ollama pull nomic-embed-text; wait"
    volumes:
      - ollama-data:/root/.ollama

  deepwiki:
    profiles: [deepwiki]
    # Pinned by digest: the LiteLLM patch below replaces one file of this
    # exact image, and a moved `latest` could break or bypass it silently.
    image: ghcr.io/asyncfuncai/deepwiki-open:latest@sha256:730b72494f407397c896c586af0a31af9671d509af420e6792d834ff094a9c8f
    container_name: sandbox-factory-deepwiki
    restart: unless-stopped
    environment:
      PORT: "8001"
      SERVER_BASE_URL: http://localhost:8001
      DEEPWIKI_CONFIG_DIR: /config
      DEEPWIKI_EMBEDDER_TYPE: ollama
      # A native Ollama on the host embeds far faster than the sidecar, which
      # has no GPU: DEEPWIKI_OLLAMA_HOST=http://host.docker.internal:11434.
      OLLAMA_HOST: ${DEEPWIKI_OLLAMA_HOST:-http://ollama:11434}
      LITELLM_BASE_URL: ${DEEPWIKI_LITELLM_BASE_URL:-https://api.deepseek.com}
      LITELLM_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPWIKI_AUTH_MODE: "false"
    # Loopback only: auth is off and its cache holds private repositories'
    # wikis. The worker reaches it over the compose network, not these.
    ports:
      - "127.0.0.1:${DEEPWIKI_PORT:-8001}:8001"
      - "127.0.0.1:${DEEPWIKI_UI_PORT:-3000}:3000"
    volumes:
      - ./apps/worker/deepwiki:/config:ro
      # The image's LiteLLM client cannot construct against its own adalflow;
      # see the patch's docstring.
      - ./apps/worker/deepwiki/patches/litellm.py:/app/api/clients/litellm.py:ro
      - deepwiki-data:/root/.adalflow
    depends_on:
      - ollama

  # ---- prod ---------------------------------------------------------------

  api:
    profiles: [prod]
    build:
      # Repo root: the API imports workspace packages that live outside
      # apps/api, so a narrower context cannot see them.
      context: .
      dockerfile: apps/api/Dockerfile
    image: sandbox-factory-api:local
    container_name: sandbox-factory-api
    restart: unless-stopped
    environment:
      PORT: 4000
      # Same-origin through the web container's nginx proxy.
      CORS_ORIGINS: http://localhost:${WEB_PROD_PORT:-8080}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sandbox_factory
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-8333}
      S3_BUCKET: sandbox-factory
      S3_ACCESS_KEY_ID: sandbox
      S3_SECRET_ACCESS_KEY: sandboxsecret
      # Real secrets, supplied by the environment — see the dev service above.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: http://localhost:${API_PORT:-4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      JIRA_CLIENT_ID: ${JIRA_CLIENT_ID:-}
      JIRA_CLIENT_SECRET: ${JIRA_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      MAX_ACTIVE_RUNS_PER_ORG: ${MAX_ACTIVE_RUNS_PER_ORG:-3}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIZING_MODEL: ${SIZING_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SIZING_MODEL: ${DEEPSEEK_SIZING_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
    expose:
      - "4000"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: sandbox-factory-web:local
    container_name: sandbox-factory-web
    restart: unless-stopped
    environment:
      # Substituted into nginx.conf at container start.
      API_URL: http://api:4000
    ports:
      - "${WEB_PROD_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres-data:
    name: sandbox-factory-postgres-data
  seaweedfs-data:
    name: sandbox-factory-seaweedfs-data
  ollama-data:
    name: sandbox-factory-ollama-data
  deepwiki-data:
    name: sandbox-factory-deepwiki-data
