# Local development and production-style services.
#
# Two profiles, because the two modes want opposite things:
#
#   dev   source bind-mounted, hot reload, node_modules installed in the image
#         and shadowed by an anonymous volume so host and container never share
#         a tree. Start it with `make up`.
#
#   prod  multi-stage builds, nothing mounted, nginx serving the built web app.
#         What deployment looks like. Start it with `make up-prod`.
#
# Postgres and SeaweedFS have no profile, so they start in both — and on their
# own with `docker compose up -d postgres seaweedfs`, which is all `make db-up`
# does. The API requires Postgres: it has no in-memory fallback, so it will not
# boot without DATABASE_URL.
#
# The VS Code extension is deliberately absent. It has no server process: it is
# a bundle that the editor on your host loads, so a container cannot run it.
# `make ext-watch` and `make ext-package` handle it on the host instead.

services:
  postgres:
    image: postgres:17-alpine
    container_name: sandbox-factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sandbox_factory
    ports:
      # Overridable so this does not fight an existing local Postgres.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Depended on with `condition: service_healthy`, so nothing starts
      # against a database that is still coming up.
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandbox_factory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  seaweedfs:
    # `server` runs master, volume, filer and the S3 gateway in one process.
    # That is the right trade for local development and CI; a real deployment
    # splits them so volumes can scale independently of the gateway.
    image: chrislusf/seaweedfs:3.80
    container_name: sandbox-factory-seaweedfs
    restart: unless-stopped
    command: >
      server -dir=/data -s3 -s3.port=8333
      -master.volumeSizeLimitMB=128 -volume.max=8
    environment:
      # SeaweedFS reads S3 credentials from these; the API signs requests with
      # the matching S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY. Development
      # values only — production supplies real ones through the environment.
      AWS_ACCESS_KEY_ID: sandbox
      AWS_SECRET_ACCESS_KEY: sandboxsecret
    ports:
      # 8333 is the S3 gateway — the only port the API talks to.
      - "${S3_PORT:-8333}:8333"
      # 8888 is the filer's HTTP browser, handy for confirming an upload
      # landed. Not used by any code.
      - "${SEAWEED_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The S3 gateway comes up after the master and volume servers, so this
      # checks the port the API actually uses rather than the master's.
      #
      # 127.0.0.1, not localhost: wget resolves localhost to ::1 first and
      # SeaweedFS does not bind IPv6, so the probe fails against a healthy
      # gateway. No pipe either — it would mask wget's exit status.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---- dev ----------------------------------------------------------------

  api-dev:
    profiles: [dev]
    image: node:22-alpine
    container_name: sandbox-factory-api-dev
    working_dir: /repo
    # The workspace packages must be built before the API can resolve them:
    # on a fresh clone packages/*/dist does not exist yet and tsc fails with
    # "Cannot find module 'sandbox-factory'". `^...` builds exactly this
    # workspace's dependencies, in order.
    command: >
      sh -c "npm ci --ignore-scripts
      && npx turbo run build --filter=@sandbox-factory/api^...
      && npm run dev --workspace @sandbox-factory/api"
    environment:
      PORT: 4000
      CORS_ORIGINS: http://localhost:5173
      # Required: the API has no in-memory fallback and will not boot without
      # it. Host and port are the compose service, not localhost.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sandbox_factory
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: sandbox-factory
      S3_ACCESS_KEY_ID: sandbox
      S3_SECRET_ACCESS_KEY: sandboxsecret
      # Auth. Unlike the S3 credentials above, these are *not* development
      # values with defaults — they are real OAuth secrets, so they come from
      # the host environment (or a gitignored .env) and are never written here.
      #
      # Passed through empty rather than with compose's `:?` guard: that guard
      # is evaluated for the whole file, so it would also break `make db-up`,
      # which starts Postgres alone and needs no OAuth client. An unset value
      # instead fails in the API's own env parsing, which is where the readable
      # message lives.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # The browser reaches the API on localhost, so the OAuth callback the
      # provider redirects to has to be the published port, not the service name.
      BETTER_AUTH_URL: http://localhost:${API_PORT:-4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - .:/repo
      # Anonymous volumes shadow the bind mount, so the container's own
      # node_modules are used rather than the host's — the host tree holds
      # darwin binaries and symlinks that are wrong inside linux.
      - /repo/node_modules
      - /repo/apps/api/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/client/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  web-dev:
    profiles: [dev]
    image: node:22-alpine
    container_name: sandbox-factory-web-dev
    working_dir: /repo
    # Same dependency build as the API, then Vite. --host binds 0.0.0.0;
    # its default of localhost is unreachable from outside the container.
    command: >
      sh -c "npm ci --ignore-scripts
      && npx turbo run build --filter=@sandbox-factory/web^...
      && npm run dev --workspace @sandbox-factory/web -- --host 0.0.0.0"
    environment:
      # The dev server proxies /api here; inside the network the API is
      # reachable by service name, not localhost.
      VITE_API_URL: http://api-dev:4000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/repo
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/client/node_modules
    depends_on:
      - api-dev

  # ---- prod ---------------------------------------------------------------

  api:
    profiles: [prod]
    build:
      # Repo root: the API imports workspace packages that live outside
      # apps/api, so a narrower context cannot see them.
      context: .
      dockerfile: apps/api/Dockerfile
    image: sandbox-factory-api:local
    container_name: sandbox-factory-api
    restart: unless-stopped
    environment:
      PORT: 4000
      # Same-origin through the web container's nginx proxy, so no cross-origin
      # request is made in this topology.
      CORS_ORIGINS: http://localhost:${WEB_PROD_PORT:-8080}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sandbox_factory
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: sandbox-factory
      S3_ACCESS_KEY_ID: sandbox
      S3_SECRET_ACCESS_KEY: sandboxsecret
      # Real secrets, supplied by the environment — see the dev service above.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: http://localhost:${API_PORT:-4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
    expose:
      - "4000"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: sandbox-factory-web:local
    container_name: sandbox-factory-web
    restart: unless-stopped
    environment:
      # Substituted into nginx.conf at container start.
      API_URL: http://api:4000
    ports:
      - "${WEB_PROD_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres-data:
    name: sandbox-factory-postgres-data
  seaweedfs-data:
    name: sandbox-factory-seaweedfs-data
