# CodeRabbit AI review config. Free on the Open Source plan for public repos.
# Activates once the CodeRabbit GitHub App is installed on the repository.
language: en-US

reviews:
  profile: chill
  request_changes_workflow: true
  # Stable legacy status surface, consumed by our SHA-bound Review gate.
  review_progress: false
  commit_status: true
  fail_commit_status: true
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords: []
  path_filters:
    - "!dist/**"
    - "!dist-test/**"
    - "!package-lock.json"
  # Agentic fixes. Trigger with `@coderabbitai autofix` (commits to the PR
  # branch) or `@coderabbitai autofix stacked pr` (opens a separate PR).
  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true

chat:
  auto_reply: true
