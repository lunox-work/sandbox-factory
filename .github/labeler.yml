documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"

tests:
  - changed-files:
      - any-glob-to-any-file: "test/**"

source:
  - changed-files:
      - any-glob-to-any-file: "src/**"
