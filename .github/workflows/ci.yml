name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is load-bearing: `Test (Node 22)` and `Test (Node 24)` are the
  # required status checks in the branch ruleset. Renaming this job or changing
  # the matrix values leaves a missing required context and blocks merging.
  # Update the protection policy alongside check names.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # The email single-owner rule lives in triggers and functional indexes
    # (migrations 0007-0011), which need a real server.
    # `email-single-owner.test.ts` skips when none is reachable, so without this
    # service those tests would quietly not run and the suite would stay green.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without the health check the first connection can beat the server,
        # which reads as "not reachable" and skips.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts skips husky's `prepare`, which has nothing to install
      # on a CI runner and fails outside a git work tree.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Each step fans out across every workspace via turbo; a new workspace is
      # covered as soon as it declares the matching script.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Start the S3 compatibility fixture
        run: |
          docker run -d --name analysis-test-objects -p 8333:8333             -e AWS_ACCESS_KEY_ID=sandbox -e AWS_SECRET_ACCESS_KEY=sandboxsecret             --health-cmd 'wget -q -O /dev/null http://127.0.0.1:8333'             --health-interval 2s --health-retries 30             chrislusf/seaweedfs:3.80 server -dir=/tmp -s3 -s3.port=8333             -master.volumeSizeLimitMB=128 -volume.max=8
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' analysis-test-objects)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs analysis-test-objects
          exit 1

      # Enforces the coverage thresholds each workspace sets in its own `test`
      # script.
      - name: Test and coverage
        run: npm test
        env:
          # The trigger tests create and drop their own scratch database on this
          # server, not the one named here.
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Bounty concurrency integration
        run: npm run test:bounty-concurrency --workspace @sandbox-factory/db
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      # Provenance injection fails *quietly*: a bad `define`, an undeclared
      # turbo env var or a renamed field just stamps the artifact "unknown". The
      # build above ran with no BUILD_* set (the local-dev path), so this
      # rebuilds with an injected sha (the deploy path) and checks it arrived.
      - name: Confirm the build records its commit
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref_name }}
        run: |
          npx turbo run build --filter=@sandbox-factory/web --force
          if ! grep -qF "$BUILD_SHA" apps/web/dist/assets/*.js; then
            echo "::error::the web bundle does not contain $BUILD_SHA — build provenance is not reaching the artifact (see docs/versioning.md)"
            exit 1
          fi
          echo "ok: the bundle records $BUILD_SHA"

      # A skipped suite looks like a passing one, and this suite is the only
      # coverage migrations 0007-0011 have. Asserting on the number of tests run
      # catches both an unreachable Postgres and a suite that lost its tests.
      - name: Confirm the database-backed tests actually ran
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          cd packages/db
          ran=$(node --test dist-test/test/email-single-owner.test.js 2>&1 \
                  | sed -n 's/^[^0-9]*tests \([0-9]*\)$/\1/p' | head -1)
          echo "email-single-owner tests run: ${ran:-none}"
          if [ "${ran:-0}" -lt 8 ]; then
            echo "::error::expected at least 8 database-backed tests, saw ${ran:-0} — Postgres unreachable, or the suite lost tests"
            exit 1
          fi

  worker-smoke:
    name: Worker image smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run pinned Graphify and archive fixture in the real worker image
        run: npm run worker:smoke

  # The TLA+ models and Lean proofs under docs/specs: a claim about the code
  # that must stay true as it changes. Independent of Node and cheap, so it
  # runs beside the tests on every push and PR. Not in `npm run verify`,
  # which must pass without Java or Lean installed.
  formal:
    name: Formal specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TLC from the last stable TLA+ release, pinned by checksum and cached
      # under it, so a cache hit is the same bytes. Java is on the runner image.
      - name: Cache TLC
        id: tlc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/tla2tools.jar
          key: tla2tools-${{ env.TLA2TOOLS_SHA256 }}
      - name: Fetch TLC
        if: steps.tlc.outputs.cache-hit != 'true'
        run: curl -sSfL -o /tmp/tla2tools.jar "$TLA2TOOLS_URL"
      - name: Verify TLC
        run: |
          echo "$TLA2TOOLS_SHA256  /tmp/tla2tools.jar" | sha256sum -c -
          java -version

      # Every invariant and temporal property of every spec; see
      # docs/specs/README.md for what each one states.
      - name: Model-check the TLA+ specs
        working-directory: docs/specs
        run: |
          for spec in ProgressWriter JobLimit RunLease; do
            echo "::group::$spec"
            java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers auto -deadlock -cleanup -config "$spec.cfg" "$spec.tla"
            echo "::endgroup::"
          done

      # The documented non-property: the fence makes writes exclusive, not
      # execution. TLC must still find that trace; exit 12 is an invariant
      # violation, and the output must name this invariant rather than some
      # other. Anything else means the model, or the claim, has moved.
      - name: Confirm the documented counterexample still exists
        working-directory: docs/specs
        run: |
          set +e
          java -XX:+UseParallelGC -jar /tmp/tla2tools.jar -workers auto -deadlock -cleanup -config RunLease_Exclusive.cfg RunLease.tla | tee /tmp/exclusive.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 12 ]; then
            echo "::error::RunLease_Exclusive.cfg is expected to fail with an invariant violation (exit 12), got $status; see docs/specs/README.md"
            exit 1
          fi
          if ! grep -q "Invariant ExecutionExclusive is violated" /tmp/exclusive.txt; then
            echo "::error::TLC failed, but not on ExecutionExclusive; see output above"
            exit 1
          fi
          echo "ok: ExecutionExclusive is violated, as documented"

      # Installs the toolchain `lean-toolchain` names and runs `lake build`.
      - name: Build the Lean proofs
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: docs/specs/lean
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "true"

      # A proof is only as good as what it assumes: every declaration under
      # the project's namespace must rest on Lean's two standard axioms and
      # nothing else, which also rules out `sorry` (it would appear as
      # `sorryAx`). Audit.lean finds the declarations itself, so a theorem
      # added later is audited without being listed here.
      - name: Audit the proofs' axioms
        working-directory: docs/specs/lean
        run: PATH="$HOME/.elan/bin:$PATH" lake env lean Audit.lean
