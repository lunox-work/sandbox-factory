name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is load-bearing: `Test (Node 22)` and `Test (Node 24)` are the
  # required status checks named in the branch ruleset. Renaming this job — or
  # changing the matrix values — silently stops branch protection from
  # requiring it, and auto-merge will then merge on checks that never ran.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # The email single-owner rule is enforced by triggers and functional
    # indexes (migrations 0007-0011), and SQL only runs against a real server.
    # `email-single-owner.test.ts` skips when nothing is reachable, so without
    # this service those tests would quietly not run and the suite would still
    # be green — which is the failure mode the tests were written to end.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the first connection can land before the server is
        # accepting them, which reads as "not reachable" and skips.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts skips husky's `prepare`, which has nothing to install
      # on a CI runner and fails outside a git work tree.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Each step fans out across every workspace via turbo. A new workspace is
      # covered the moment it declares the matching script — there is no list
      # here to forget to update.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # Enforces the per-package coverage thresholds; each workspace sets its
      # own in its `test` script rather than sharing one global number.
      - name: Test and coverage
        run: npm test
        env:
          # The trigger tests create and drop their own scratch database on
          # this server rather than using the one named here, so nothing they
          # do touches another test's data.
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      # A skipped suite is indistinguishable from a passing one in the summary
      # above, and this is the suite where that matters: it is the only
      # coverage migrations 0007-0011 have. If the service were unreachable the
      # whole file would skip and `npm test` would still be green.
      #
      # The assertion is on the number of tests that ran, not on the skip
      # marker: a skipped suite reports `tests 0`, and so would a suite that
      # silently stopped containing any. Both are failures worth catching.
      - name: Confirm the database-backed tests actually ran
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          cd packages/db
          ran=$(node --test dist-test/test/email-single-owner.test.js 2>&1 \
                  | sed -n 's/^[^0-9]*tests \([0-9]*\)$/\1/p' | head -1)
          echo "email-single-owner tests run: ${ran:-none}"
          if [ "${ran:-0}" -lt 8 ]; then
            echo "::error::expected at least 8 database-backed tests, saw ${ran:-0} — Postgres unreachable, or the suite lost tests"
            exit 1
          fi
