name: Release artifacts

# Runs when a release tag is published, not on every push to main. cd.yml tags
# only after a deploy verifies against the live site, so building per push would
# attest to commits that never shipped.
on:
  push:
    # `sandbox-factory-v1.2.3`, not `v1.2.3` — see releaseTag() in
    # packages/shared. A pattern that matches nothing fails silently: the
    # workflow never runs, and the only symptom is releases with no artifacts.
    tags: ["sandbox-factory-v*"]
  # Manual runs, for re-attesting an existing tag after a workflow fix.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the current ref)"
        required: false
        type: string

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` mints the OIDC token Sigstore exchanges for a signing
      # certificate, tying the signature to this workflow rather than to a
      # copyable key. `attestations: write` stores the result.
      #
      # This job cannot write to the release: uploading is a separate job, so
      # the signing identity never holds write access to repository contents.
      contents: read
      id-token: write
      attestations: write

    steps:
      # Full history: the provenance step uses `git describe --exact-match`, and
      # a shallow fetch brings no tags, so the ref would quietly degrade to a
      # branch name.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Resolved once, into the environment, so every artifact carries one
      # identical record (per-build resolution gives each its own buildTime).
      #
      # --require-identified fails the job rather than shipping a release that
      # silently degrades to "unknown".
      #
      # BUILD_SHA and BUILD_REF are read off the checkout, not left to the
      # resolver, which prefers GITHUB_SHA. On a workflow_dispatch GITHUB_SHA is
      # the default branch while the checkout is at `inputs.tag`: run
      # 35227079381 built 7456ae4, stamped every artifact `80d1860`, and passed
      # both guards below, which only prove the resolver and the bundle agree.
      - name: Resolve build provenance
        run: |
          # The checkout, not the event; they differ on a dispatch.
          BUILD_SHA="$(git rev-parse HEAD)"
          BUILD_REF="$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --abbrev-ref HEAD)"
          export BUILD_SHA BUILD_REF
          echo "resolved from the checkout: $BUILD_SHA ($BUILD_REF)"
          node scripts/build-info.mjs --require-identified --env >> "$GITHUB_ENV"
          echo "--- build provenance ---"
          node scripts/build-info.mjs --require-identified

      - name: Build
        run: npm run build

      # The guard above proves the *resolver* saw a sha; this proves it reached
      # the artifact. A misconfigured `define` or a turbo cache replaying an
      # older bundle passes the first and fails this one.
      - name: Confirm the commit reached the bundle
        run: |
          if ! grep -qF "$BUILD_SHA" apps/web/dist/assets/*.js; then
            echo "::error::built bundle does not contain $BUILD_SHA — the build ran, but the provenance never made it in"
            exit 1
          fi
          echo "ok: $BUILD_SHA is present in the web bundle"

      - name: Package the web app
        run: tar -czf sandbox-factory-web-${{ env.BUILD_SHORT_SHA }}.tar.gz -C apps/web/dist .

      # `vsce` is not a dependency of this repo; fetched here, pinned, rather
      # than added to the tree for CI's benefit.
      - name: Package the extension
        run: |
          npx --yes @vscode/vsce@3.6.0 package --no-dependencies \
            --out "../../sandbox-factory-vscode-${BUILD_SHORT_SHA}.vsix"
        working-directory: apps/extension

      # Signs a SLSA provenance statement — this artifact, built by this
      # workflow, from this commit — via Sigstore, in a public transparency log.
      # Anyone can check it:
      #
      #   gh attestation verify sandbox-factory-web-<sha>.tar.gz \
      #     --repo lunox-work/sandbox-factory
      #
      # The signature covers the artifact's digest, so a modified artifact fails
      # even though the version string inside it still reads right.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            sandbox-factory-web-*.tar.gz
            sandbox-factory-vscode-*.vsix

      # Handed to the upload job rather than uploaded here, so that this job
      # keeps `contents: read`.
      - uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: |
            sandbox-factory-web-*.tar.gz
            sandbox-factory-vscode-*.vsix
          if-no-files-found: error

  upload:
    name: Attach to release
    needs: attest
    # A tag push, or a manual run that named a tag. `github.ref` is
    # `refs/heads/main` for every workflow_dispatch, so gating on it alone signs
    # the artifacts and then drops them (run 35219963548).
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      # Deliberately not combined with the signing job: `id-token: write` plus
      # `contents: write` in one job would let a single compromised step forge
      # an attestation and publish what it attests to.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      # TAG: a dispatch runs from the default branch and carries the tag in its
      # input, so the ref alone is not enough.
      #
      # GH_REPO: this job has no checkout, so gh cannot infer the repository and
      # exits with "fatal: not a git repository" unless it is named.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            sandbox-factory-web-*.tar.gz \
            sandbox-factory-vscode-*.vsix \
            --clobber
