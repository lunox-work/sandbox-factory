name: Release artifacts

# Runs when a release tag is published — not on every push to main.
#
# cd.yml creates a tag only after a deploy has verified itself against the live
# site, so a tag is the repository's statement that a specific commit reached
# production. Building on every push instead would attest to commits that never
# shipped.
on:
  push:
    # `sandbox-factory-v1.2.3`, not `v1.2.3`.
    #
    # The prefix comes from release-please, which configured packages/core as a
    # named package in a manifest-driven monorepo. release-please is gone and
    # cd.yml cuts the tags now, but the shape is kept — see releaseTag() in
    # packages/shared. This pattern matched `v*` until 2026-09-17 and therefore
    # matched nothing that had ever been produced — the workflow was green
    # because it never ran. Nothing reports a trigger that does not fire, which
    # is why it survived: the only visible symptom was releases with no
    # attached artifacts.
    tags: ["sandbox-factory-v*"]
  # Manual runs, for re-attesting an existing tag after a workflow fix.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the current ref)"
        required: false
        type: string

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      # The three that signing needs, and nothing else.
      #
      # `id-token: write` is the load-bearing one: it mints the short-lived
      # OIDC token that Sigstore exchanges for a signing certificate, which is
      # what ties the signature to this workflow in this repository rather than
      # to a key someone could copy. `attestations: write` stores the result.
      # `contents: read` checks the tag out.
      #
      # Note this job cannot write to the release — uploading is a separate job
      # below, so the job holding the signing identity never holds write access
      # to the repository's contents.
      contents: read
      id-token: write
      attestations: write

    steps:
      # Full history, because the provenance step below names the checkout with
      # `git describe --exact-match`, and the default shallow fetch brings down
      # no tags at all — describe would fail and quietly degrade the ref to a
      # branch name, which is the failure this whole step exists to prevent.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Resolved once, into the environment, so every artifact below is stamped
      # with one identical record. Resolving per-build would give each a
      # different buildTime and make two artifacts of one release look like two
      # different builds.
      #
      # --require-identified fails the job rather than shipping a release that
      # cannot say which commit it came from. That is the whole point of the
      # exercise, and without the guard it degrades silently to "unknown" — the
      # API still boots, the footer still renders, and nothing is verifiable.
      #
      # BUILD_SHA and BUILD_REF are read off the checkout rather than left to
      # the resolver's own precedence, which prefers GITHUB_SHA over
      # `git rev-parse HEAD`. That preference is right for a tag push, where the
      # two agree, and wrong for a workflow_dispatch: GITHUB_SHA then describes
      # the ref the run was dispatched from — the default branch — while the
      # checkout above is at `inputs.tag`. Run 35227079381 built 7456ae4 and
      # stamped every artifact `80d1860`, then passed both guards below, because
      # the sha was present and the bundle did contain the value that had been
      # injected. Neither check can catch this: they prove the resolver and the
      # bundle agree, not that either matches what was checked out.
      - name: Resolve build provenance
        run: |
          # The checkout, not the event. For a tag push these equal the event's
          # own values; for a dispatch they are the tag that was asked for.
          BUILD_SHA="$(git rev-parse HEAD)"
          BUILD_REF="$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --abbrev-ref HEAD)"
          export BUILD_SHA BUILD_REF
          echo "resolved from the checkout: $BUILD_SHA ($BUILD_REF)"
          node scripts/build-info.mjs --require-identified --env >> "$GITHUB_ENV"
          echo "--- build provenance ---"
          node scripts/build-info.mjs --require-identified

      - name: Build
        run: npm run build

      # Belt and braces: the guard above proves the *resolver* saw a sha, this
      # proves the sha reached the artifact. They are different failures — a
      # misconfigured `define`, or a turbo cache replaying an older bundle,
      # would pass the first and fail this one.
      - name: Confirm the commit reached the bundle
        run: |
          if ! grep -qF "$BUILD_SHA" apps/web/dist/assets/*.js; then
            echo "::error::built bundle does not contain $BUILD_SHA — the build ran, but the provenance never made it in"
            exit 1
          fi
          echo "ok: $BUILD_SHA is present in the web bundle"

      - name: Package the web app
        run: tar -czf sandbox-factory-web-${{ env.BUILD_SHORT_SHA }}.tar.gz -C apps/web/dist .

      # `vsce` is not a dependency of this repo — the extension is packaged by
      # hand when it is published, and adding the tool to the tree just to
      # attest it would be a dependency added for CI's benefit. Fetched here
      # instead, pinned, so the release still carries a signed .vsix.
      - name: Package the extension
        run: |
          npx --yes @vscode/vsce@3.6.0 package --no-dependencies \
            --out "../../sandbox-factory-vscode-${BUILD_SHORT_SHA}.vsix"
        working-directory: apps/extension

      # What turns a version string into a verifiable claim.
      #
      # Signs a SLSA provenance statement — this artifact, built by this
      # workflow, from this commit — via Sigstore, and records it in a public
      # transparency log. Anyone can then check it without trusting us:
      #
      #   gh attestation verify sandbox-factory-web-<sha>.tar.gz \
      #     --repo lunox-work/sandbox-factory
      #
      # The signature covers the artifact's digest, so a modified artifact fails
      # verification even though the version string inside it still reads right.
      # That is the difference between this and the footer.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            sandbox-factory-web-*.tar.gz
            sandbox-factory-vscode-*.vsix

      # Handed to the upload job rather than uploaded here, so that this job
      # keeps `contents: read`.
      - uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: |
            sandbox-factory-web-*.tar.gz
            sandbox-factory-vscode-*.vsix
          if-no-files-found: error

  upload:
    name: Attach to release
    needs: attest
    # A tag push, or a manual run that named a tag.
    #
    # `github.ref` is `refs/heads/main` for a workflow_dispatch however it was
    # invoked, so gating on it alone meant a dispatch run signed both artifacts
    # and then dropped them — which is precisely the case the `tag` input
    # exists for. Observed on run 35219963548: "Attestation created for 2
    # subjects", release assets still empty.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      # The one write this job needs, and it is deliberately not combined with
      # the signing job above: `id-token: write` and `contents: write` in one
      # job means a single compromised step could both forge an attestation and
      # publish what it attests to.
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-artifacts

      # TAG: the tag the artifacts were built from, which is not always the ref
      # this run is on — a dispatch runs from the default branch and carries the
      # tag in its input instead.
      #
      # GH_REPO: this job never checks the repository out, it only downloads the
      # artifacts, so there is no `.git` for gh to infer the repository from and
      # it exits with "fatal: not a git repository". Naming the repo explicitly
      # is the documented way to run gh outside a checkout, and it avoids adding
      # a checkout purely to satisfy an inference step.
      #
      # This was never a dispatch-only problem: the job has never had a
      # checkout, so it would have failed identically on a tag push. It had
      # simply never run, because the trigger pattern never matched until
      # 2026-09-17.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            sandbox-factory-web-*.tar.gz \
            sandbox-factory-vscode-*.vsix \
            --clobber
