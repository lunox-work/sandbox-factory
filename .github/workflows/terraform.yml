name: Terraform

# Validates infrastructure changes on a PR. Plan only — never apply: `terraform
# apply` stays a deliberate local action, so no merge can silently replace a
# database or delete a CloudFront distribution.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -backend=false: no credentials and no state, so a fork's PR can be
      # validated without being granted access to anything.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Same-repository pull requests only. Forks cannot (and must not) assume the
    # plan role; they still get the validate job.
    #
    # Not on a push to main: the deploy role has no access to the state bucket
    # (it 403'd on every infra merge), and a push has no PR to comment on. After
    # a merge, `make tf-plan` is the first half of the apply anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      # The read-only plan role, which trusts the `pull_request` `sub` claim of
      # a PR's OIDC token. The deploy role is scoped to `refs/heads/main`, so
      # pull requests cannot assume it.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE }}
          aws-region: us-east-1
          role-session-name: terraform-plan

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Plan
        id: plan
        # pipefail: without it the pipeline returns tee's status, and a failing
        # `terraform plan` would record outcome=success.
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false

          # The plan role is denied secretsmanager:GetSecretValue, so refreshing
          # aws_secretsmanager_secret_version fails with AccessDenied. Those
          # resources carry ignore_changes on secret_string, so the refresh is
          # useless anyway; dropping them from the state skips it while every
          # other resource is still refreshed.
          #
          # It must be a *local copy* of the state: against the S3 backend,
          # `terraform state rm` writes back to the bucket, which this read-only
          # role cannot do. Do not add `|| true` here — it once hid exactly that
          # failure. A failure in this block fails the step.
          state="$RUNNER_TEMP/plan.tfstate"
          terraform state pull > "$state"
          printf 'terraform {\n  backend "local" {\n    path = "%s"\n  }\n}\n' "$state" > backend_override.tf
          terraform init -reconfigure -input=false

          terraform state list \
            | { grep '^aws_secretsmanager_secret_version\.' || true; } > "$RUNNER_TEMP/excluded.txt"
          while read -r addr; do
            terraform state rm "$addr" >/dev/null </dev/null
          done < "$RUNNER_TEMP/excluded.txt"
          echo "Dropped $(wc -l < "$RUNNER_TEMP/excluded.txt" | tr -d ' ') secret version(s) from the local state copy." >&2

          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
        continue-on-error: true

      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            // GitHub rejects comments over 65,536 characters.
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n... truncated. See the job log for the full plan.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan \`${{ steps.plan.outcome }}\`\n\n> Every \`aws_secretsmanager_secret_version.app[...]\` below reads **will be created**, and they are counted in the \`to add\` total. Ignore both: the read-only plan role cannot read secret values, so those resources are dropped from a local copy of the state before planning, and an apply would not recreate them. They carry \`ignore_changes\` on \`secret_string\`, so no drift is hidden — and a change to the secret *containers* still appears normally.\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`,
            });

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
