name: Terraform

# Validates infrastructure changes on a PR, the same way CI validates code.
#
# Plan only — never apply. `terraform apply` stays a deliberate local action, so
# that no merge can silently replace a database or delete a CloudFront
# distribution. The plan in the PR is what makes the change reviewable.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # -backend=false so this runs without credentials: syntax and internal
      # references are checked, no state is touched, and a fork's PR can be
      # validated without being granted access to anything.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Pull requests from this repository only.
    #
    # Forks cannot assume the plan role, and should not be able to; their PRs
    # still get the validate job above.
    #
    # Not on a push to main either. That run used to assume the deploy role,
    # which has no access to the state bucket, so it failed with a 403 on every
    # infra merge — nine out of nine — and since the check is not required,
    # nothing surfaced it. It also had nowhere to report: the plan is posted as a
    # PR comment, and a push has no PR. The plan that matters is the one on the
    # PR; after the merge, `make tf-plan` is the first half of the apply anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      # The read-only plan role. A pull request's OIDC token carries
      # `pull_request` in its `sub` claim rather than a branch ref, which is what
      # this role trusts — and what keeps pull requests out of the deploy role,
      # scoped to `refs/heads/main`.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE }}
          aws-region: us-east-1
          role-session-name: terraform-plan

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Plan
        id: plan
        # pipefail, because the default shell is `bash -e` without it: the
        # pipeline would return tee's status, so a failing `terraform plan`
        # would still record outcome=success and the job would pass on a plan
        # that never completed.
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false

          # The plan role is denied secretsmanager:GetSecretValue, so refreshing
          # aws_secretsmanager_secret_version fails with AccessDenied. That
          # refresh was never useful: those resources carry ignore_changes on
          # secret_string, so the value read back is discarded either way.
          # Dropping them from the state before planning skips it, while every
          # other resource is still refreshed and genuine drift stays visible.
          #
          # It has to be a *local copy* of the state. With the S3 backend
          # configured, `terraform state rm` writes the result back to the
          # bucket, which this read-only role cannot do. The first version of
          # this step ran it against the backend with `|| true`, so it failed
          # silently, nothing was dropped, and the plan died on AccessDenied —
          # on the very PR that introduced it. Hence: pull the state to the
          # runner, point a local backend at that file through an override, and
          # edit that. Nothing is swallowed; a failure here fails the step.
          state="$RUNNER_TEMP/plan.tfstate"
          terraform state pull > "$state"
          printf 'terraform {\n  backend "local" {\n    path = "%s"\n  }\n}\n' "$state" > backend_override.tf
          terraform init -reconfigure -input=false

          terraform state list \
            | { grep '^aws_secretsmanager_secret_version\.' || true; } > "$RUNNER_TEMP/excluded.txt"
          while read -r addr; do
            terraform state rm "$addr" >/dev/null </dev/null
          done < "$RUNNER_TEMP/excluded.txt"
          echo "Dropped $(wc -l < "$RUNNER_TEMP/excluded.txt" | tr -d ' ') secret version(s) from the local state copy." >&2

          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
        continue-on-error: true

      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            // GitHub rejects comments over 65,536 characters.
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n... truncated. See the job log for the full plan.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan \`${{ steps.plan.outcome }}\`\n\n> Every \`aws_secretsmanager_secret_version.app[...]\` below reads **will be created**, and they are counted in the \`to add\` total. Ignore both: the read-only plan role cannot read secret values, so those resources are dropped from a local copy of the state before planning, and an apply would not recreate them. They carry \`ignore_changes\` on \`secret_string\`, so no drift is hidden — and a change to the secret *containers* still appears normally.\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`,
            });

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
