name: Deploy

# Continuous deployment: production tracks main. Nothing here re-tests — CI
# gated the PR, and a push to main has already satisfied the ruleset's required
# checks (`Test (Node 22)`, `Test (Node 24)`).
#
# `push` rather than `workflow_run` after CI: workflow_run chaining is a known
# source of double-deploys and confusing reruns.
#
# The push event only fires when the merge uses a token other than GITHUB_TOKEN
# (see the arming step in auto-merge.yml). Without AUTO_MERGE_TOKEN this
# workflow runs only when dispatched by hand.

on:
  push:
    branches: [main]
    # Documentation-only changes do not affect the SPA or API.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to current HEAD)"
        required: false
        type: string

# id-token: write mints the OIDC token that both AWS and Sigstore exchange for
# credentials. attestations: write stores the signed provenance. `contents`
# stays read: this workflow can attest what it builds but cannot alter what it
# built from. packages: write pushes the public mirror of the API image to
# GHCR, the only copy an outside verifier can pull.
permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

# Never cancel a deploy in flight: stopping between the migration and the
# service update would leave the schema ahead of the code. Two merges land as
# two sequential deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: sandbox-factory

jobs:
  deploy:
    name: Deploy to production
    # Native arm64, because the image is built for arm64 to match Fargate. On
    # x86 every Dockerfile `RUN` executes under QEMU, which once hung a build
    # for almost two hours (run 35239958825). Free for public repositories.
    runs-on: ubuntu-24.04-arm
    # A healthy deploy is 4-7 minutes. The default limit is six hours, and
    # because the concurrency group queues rather than cancels, one hung run
    # blocks every later deploy for that long without reporting a failure.
    timeout-minutes: 20
    # Add a required reviewer to this Environment to gate deploys on manual
    # approval; that is a settings change, not a workflow change.
    environment:
      name: production
      url: https://platform.lunox.work

    # Consumed by the `release` job, which tags what this job verified.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      releasable: ${{ steps.version.outputs.releasable }}

    steps:
      # Full history and tags: the version step reads the commits since the
      # last tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve the commit being deployed
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      # An attestation names the commit the *run* started from (github.sha),
      # not the one checked out. They differ only when `sha` is dispatched by
      # hand, and then anything built here would be signed as a commit it did
      # not come from. So a dispatched sha must already be on main, and
      # `attestable` gates every build-and-sign step below: a rollback reuses
      # the image attested when that commit first deployed, and ships its SPA
      # unsigned rather than mis-signed.
      - name: Check the commit can be attested honestly
        id: provenance
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ "$SHA" = "$GITHUB_SHA" ]; then
            echo "attestable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main; refusing to deploy a commit that never passed the ruleset"
            exit 1
          fi
          echo "attestable=false" >> "$GITHUB_OUTPUT"
          echo "::warning::deploying $SHA from a run attested as $GITHUB_SHA; nothing built here will be signed"

      # No access key anywhere. The role's trust policy is scoped by `sub` to
      # this repository's main branch, so a fork or a pull request cannot
      # assume it.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ steps.commit.outputs.short }}

      - name: Read infrastructure configuration
        id: infra
        run: |
          # Values come from the live infrastructure, not duplicated here, so a
          # Terraform rename cannot leave this workflow pointing at nothing.
          #
          # Each lookup is checked: a failed query and an empty match both
          # yield "" or "None" without aborting, and would otherwise surface
          # later as a malformed argument (`docker buildx --tag :<sha>`).
          resolve() {
            local name="$1" value
            shift
            value="$("$@")" || value=""
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::could not resolve $name — is the infrastructure applied in $AWS_REGION?"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          }

          resolve ecr aws ecr describe-repositories \
            --repository-names "$PROJECT-api" \
            --query 'repositories[0].repositoryUri' --output text
          resolve bucket aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, '$PROJECT-web-')].Name | [0]" --output text
          resolve distribution aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'platform.lunox.work')].Id | [0]" --output text

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Computed BEFORE the build, because the version and tag are compiled
      # into the bundle; resolving them afterwards would ship a bundle reporting
      # the previous version and a `main` ref, and releaseUrl() in
      # packages/shared would return undefined for a real release.
      #
      # The tag itself is cut by the `release` job only after the deploy
      # verifies, since a tag means "this ran in production". If the deploy
      # fails, no tag is created and the bundle was never published.
      - name: Work out the version being released
        id: version
        run: |
          # The base version comes from the last tag, not package.json: nothing
          # bumps package.json on release, so using it would recompute the same
          # number every deploy and collide with an existing tag.
          # `--sort=-v:refname` orders semantically: v1.10.0 above v1.9.0.
          last="$(git tag -l 'sandbox-factory-v*' --sort=-v:refname | head -1)"
          echo "last release: ${last:-<none>}"

          # With no tags at all, fall back to package.json.
          if [[ -n "$last" ]]; then
            current="${last#sandbox-factory-v}"
          else
            current="$(node -p "require('./package.json').version")"
          fi
          echo "base version: $current"

          # Exit 1 means nothing releasable (docs- or chore-only). The deploy
          # still happens, as the current version, and no tag is cut.
          if next="$(node scripts/next-version.mjs --from "$last" --to HEAD --current "$current")"; then
            echo "value=$next" >> "$GITHUB_OUTPUT"
            echo "ref=sandbox-factory-v$next" >> "$GITHUB_OUTPUT"
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            echo "this deploy releases $current -> $next"
          else
            echo "value=$current" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "nothing releasable; deploying as $current without a tag"
          fi

      # ---- build the SPA ---------------------------------------------------

      # BUILD_SHA is compiled into the bundle by apps/web/vite.config.ts, and
      # the verification step reads it back off the live site.
      #
      # BUILD_VERSION must be set explicitly, to a semver: the resolver's
      # package.json fallback reports the last manual bump, not this release,
      # and formatVersion appends the sha itself, so passing a sha here
      # duplicates it (`cd09b15+cd09b15`).
      #
      # BUILD_REF carries the tag rather than `main` when this deploy releases;
      # releaseUrl() matches on it to offer the release link.
      - name: Build the web app
        env:
          BUILD_SHA: ${{ steps.commit.outputs.sha }}
          BUILD_REF: ${{ steps.version.outputs.ref }}
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npx turbo run build --filter=@sandbox-factory/web
          if ! grep -qF "$BUILD_SHA" apps/web/dist/assets/*.js; then
            echo "::error::the bundle does not contain $BUILD_SHA — provenance is not reaching the artifact"
            exit 1
          fi
          echo "ok: the bundle records $BUILD_SHA"

      # release.yml attests a tarball from its own build, whose bytes are not
      # the ones on the CDN. This signs the files that are: every file in dist
      # is a subject of one attestation, so anyone can download what the site
      # served them and check it, with no registry or credentials involved:
      #
      #   curl -sO https://platform.lunox.work/index.html
      #   gh attestation verify index.html --repo lunox-work/sandbox-factory
      #
      # scripts/verify-production.sh does that for the whole site.
      - name: List the web app's files
        if: steps.provenance.outputs.attestable == 'true'
        run: |
          cd apps/web/dist
          find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/web-checksums.txt"
          echo "$(wc -l < "$RUNNER_TEMP/web-checksums.txt") files"

      - name: Attest the web app
        if: steps.provenance.outputs.attestable == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: ${{ runner.temp }}/web-checksums.txt

      # ---- build and push the API image ------------------------------------

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # The ECR repository is IMMUTABLE, so pushing an existing tag is an
      # error, and a `workflow_dispatch` retry of the same commit would fail
      # on a step that already succeeded. Skipping the build makes a redeploy
      # idempotent without weakening the guarantee: no other image can have
      # this tag.
      - name: Check whether the image already exists
        id: image
        run: |
          if aws ecr describe-images \
               --repository-name "$PROJECT-api" \
               --image-ids "imageTag=${{ steps.commit.outputs.sha }}" \
               >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "image for ${{ steps.commit.outputs.sha }} is already in ECR; skipping the build"
          elif [ "${{ steps.provenance.outputs.attestable }}" != "true" ]; then
            echo "::error::no image for ${{ steps.commit.outputs.sha }} in ECR, and building one here would sign it as $GITHUB_SHA"
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR holds a public copy of every deployed image. ECR is private, so
      # without it a verifier can look up the attestation for a digest but
      # never see the bytes it describes.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Name the public mirror
        id: mirror
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      # arm64 to match Fargate; a mismatch only surfaces as "exec format error"
      # when the task starts. `platforms:` stays explicit even on an arm64
      # runner, so a runner change falls back to emulation rather than shipping
      # the wrong architecture.
      - name: Build and push the API image
        id: build
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          # Both registries from one build, so they receive the same manifest
          # and therefore the same digest.
          tags: |
            ${{ steps.infra.outputs.ecr }}:${{ steps.commit.outputs.sha }}
            ${{ steps.mirror.outputs.repo }}:${{ steps.commit.outputs.sha }}
          # The same three values as the web bundle, so /version and the footer
          # report one build.
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_SHA=${{ steps.commit.outputs.sha }}
            BUILD_REF=${{ steps.version.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Depends on the build being single-platform: one image manifest, so the
      # digest pushed to ECR is the one the runtime reports as `ImageID`, which
      # the final verification and the attestation lookup both rely on. A
      # second platform would push a manifest *list* with a different digest;
      # attest the per-platform digest if that day comes.
      #
      # A redeploy skips the build, so its digest is read back from the
      # registry; without that a redeploy could not verify itself.
      - name: Resolve the image digest
        id: digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="$(aws ecr describe-images \
              --repository-name "$PROJECT-api" \
              --image-ids "imageTag=${{ steps.commit.outputs.sha }}" \
              --query 'imageDetails[0].imageDigest' --output text)"
          fi
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            echo "::error::could not determine the image digest for ${{ steps.commit.outputs.sha }}"
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          echo "Image digest: $digest"

      # Before anything reaches production, so nothing runs there that the
      # public cannot pull. A fresh build pushed both registries already; a
      # redeploy of an image that predates the mirror is copied across here.
      # Either way the digests must match: a mirror holding different bytes
      # would be worse than none.
      - name: Check the public mirror holds the same image
        env:
          ECR: ${{ steps.infra.outputs.ecr }}
          MIRROR: ${{ steps.mirror.outputs.repo }}
          SHA: ${{ steps.commit.outputs.sha }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          mirrored() {
            docker buildx imagetools inspect "$MIRROR:$SHA" \
              --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'
          }

          if [ -z "$(mirrored)" ]; then
            echo "copying $DIGEST to $MIRROR"
            docker buildx imagetools create --tag "$MIRROR:$SHA" "$ECR@$DIGEST"
          fi

          actual="$(mirrored)"
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::$MIRROR:$SHA is ${actual:-missing}, but production will run $DIGEST"
            exit 1
          fi
          echo "ok: $MIRROR@$DIGEST"

          # A warning, not a failure: GHCR creates a package private, its
          # visibility can only be changed in the UI, and the package does not
          # exist until the first run of this step has pushed it.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${MIRROR#ghcr.io/}:pull" | jq -r '.token // empty')"
          if ! curl -fsS -o /dev/null \
                 -H "Authorization: Bearer $token" \
                 -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                 "https://ghcr.io/v2/${MIRROR#ghcr.io/}/manifests/$DIGEST"; then
            echo "::warning::$MIRROR cannot be pulled anonymously. Make the package public (Package settings → Change visibility), or outside verification has nothing to pull."
          fi

      # Signs the image that actually runs in production (release.yml attests
      # only the tagged release artifacts): this digest, built by this
      # workflow, from this commit, in a public transparency log. Anyone
      # holding the digest can check it:
      #
      #   gh api /repos/lunox-work/sandbox-factory/attestations/sha256:...
      #
      # The API publishes the digest at GET /version, read from the container
      # runtime rather than a build argument. See apps/api/src/image-digest.ts
      # and docs/versioning.md.
      #
      # Skipped on a redeploy: the digest is unchanged, so the existing
      # attestation still verifies.
      - name: Attest the deployed image
        if: steps.image.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          # Named for the mirror, where a verifier can find these bytes.
          # Verification matches on the digest, which both registries share:
          #
          #   gh attestation verify oci://ghcr.io/lunox-work/sandbox-factory-api@sha256:... \
          #     --repo lunox-work/sandbox-factory
          subject-name: ${{ steps.mirror.outputs.repo }}
          subject-digest: ${{ steps.digest.outputs.value }}
          # Stored in the repository's attestation store, which is where `gh
          # attestation verify` looks by default.
          push-to-registry: false

      # ---- migrate, then deploy --------------------------------------------

      # Migrations run before the service update, so a new task never starts
      # against a schema older than the code expects. This assumes
      # backward-compatible (expand then contract) migrations.
      - name: Register the task definition
        id: taskdef
        run: |
          current="$(aws ecs describe-task-definition \
            --task-definition "$PROJECT-api" \
            --query 'taskDefinition' --output json)"

          # Swap the image and BUILD_SHA, drop the read-only fields AWS returns
          # but rejects on register, and keep everything else as Terraform set it.
          echo "$current" | jq \
            --arg img "${{ steps.infra.outputs.ecr }}:${{ steps.commit.outputs.sha }}" \
            --arg sha "${{ steps.commit.outputs.sha }}" '
              .containerDefinitions[0].image = $img
              | .containerDefinitions[0].environment =
                  ((.containerDefinitions[0].environment // [])
                   | map(select(.name != "BUILD_SHA"))
                   + [{name: "BUILD_SHA", value: $sha}])
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            ' > taskdef.json

          arn="$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Registered $arn"

      # Against Neon, over the public internet, from a task in a public subnet.
      # Neon suspends after ~5 minutes idle; the migration runner's timeout
      # covers the wake-up.
      - name: Run database migrations
        run: |
          subnets="$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=$PROJECT-public-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')"
          sg="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$PROJECT-tasks" \
            --query 'SecurityGroups[0].GroupId' --output text)"

          SUBNETS="$subnets" SECURITY_GROUP="$sg" \
            ./infra/scripts/run-migrations.sh "${{ steps.commit.outputs.sha }}"

      - name: Update the ECS service
        run: |
          aws ecs update-service \
            --cluster "$PROJECT" \
            --service "$PROJECT-api" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --query 'service.serviceName' --output text

          echo "Waiting for the service to stabilise..."
          # The deployment circuit breaker rolls back if the new tasks fail to
          # start, so a timeout here means the rollback already happened. There
          # is no load balancer to drain: ECS deregisters the old task from
          # Service Discovery and the 15-second record TTL carries the rest.
          aws ecs wait services-stable \
            --cluster "$PROJECT" \
            --services "$PROJECT-api"

      # ---- publish the SPA -------------------------------------------------

      # After the API, so the browser never receives a bundle that calls an
      # endpoint which is not deployed yet.
      - name: Publish the web app
        run: |
          # New assets first, deliberately WITHOUT --delete: the previous
          # index.html is still being served and references the previous
          # hashes. Hashed filenames make adding safe.
          aws s3 sync apps/web/dist "s3://${{ steps.infra.outputs.bucket }}" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          # Then flip the document, uncached.
          aws s3 cp apps/web/dist/index.html "s3://${{ steps.infra.outputs.bucket }}/index.html" \
            --cache-control "no-cache, must-revalidate"

          # Prune only objects both absent from this build and older than the
          # grace period: an open tab holding the previous index.html can
          # request a lazy-loaded chunk hours later. Do not replace this with
          # an age-based lifecycle rule (eventually deletes the *live* bundle)
          # or with deleting everything not in this build (404s those tabs).
          GRACE_HOURS=24
          cutoff_epoch="$(( $(date -u +%s) - GRACE_HOURS * 3600 ))"

          # Age is compared here, not in a --query filter: JMESPath orders
          # numbers only, so `LastModified <= '<string>'` evaluates to null and
          # silently drops every element, making this step a no-op.
          keep="$(cd apps/web/dist && find assets -type f | sort)"

          aws s3api list-objects-v2 \
            --bucket "${{ steps.infra.outputs.bucket }}" \
            --prefix assets/ \
            --query 'Contents[].[Key,LastModified]' \
            --output text \
          | while read -r key modified; do
              [ -z "$key" ] || [ "$key" = "None" ] && continue
              # GNU date(1) syntax; the runner is Linux.
              age_epoch="$(date -u -d "$modified" +%s 2>/dev/null)" || continue
              [ "$age_epoch" -le "$cutoff_epoch" ] && echo "$key"
            done | sort > /tmp/old-assets.txt

          comm -13 <(echo "$keep") /tmp/old-assets.txt | while read -r stale; do
            [ -z "$stale" ] && continue
            echo "pruning $stale (absent from this build, older than ${GRACE_HOURS}h)"
            aws s3 rm "s3://${{ steps.infra.outputs.bucket }}/$stale"
          done

      - name: Invalidate the CDN
        run: |
          # Only index.html needs invalidating; every other file has a new name.
          # Invalidating /* would be slower and, past 1,000 paths a month, billed.
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.distribution }}" \
            --paths "/index.html" "/" \
            --query 'Invalidation.Id' --output text

      # ---- prove it ---------------------------------------------------------

      # The digest is passed as well as the sha, so this checks the bytes
      # running and not only their label. See the header of verify-deploy.sh.
      - name: Verify the deployment
        run: |
          ./infra/scripts/verify-deploy.sh \
            "${{ steps.commit.outputs.sha }}" \
            "https://platform.lunox.work" \
            "${{ steps.digest.outputs.value }}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deployment ${{ job.status }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ steps.commit.outputs.short }}\` |"
            echo "| URL | https://platform.lunox.work |"
            echo "| Image | \`${{ steps.commit.outputs.sha }}\` |"
            echo "| Digest | \`${{ steps.digest.outputs.value }}\` |"
            echo
            echo "Fetch this deployment's signed provenance, without trusting this run:"
            echo
            echo '```'
            echo "gh api /repos/${{ github.repository }}/attestations/${{ steps.digest.outputs.value }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- tag what just shipped ---------------------------------------------
  #
  # Runs only after the deploy verified against the live site, so a tag means
  # "this ran in production", not "this merged"; a failed deploy leaves no
  # release.
  #
  # The version is the one `deploy` compiled into the bundle. Do not recompute
  # it here: a tag created meanwhile could yield a version no artifact reports.
  #
  # A separate job because tagging needs `contents: write` and `deploy` holds
  # AWS credentials: the job that can write to the repository cannot touch
  # production, and vice versa.
  release:
    name: Tag the release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # workflow_dispatch is excluded: a redeploy of an older commit must not
    # tag, because its version was computed against a tag main has already
    # moved past.
    if: github.event_name == 'push' && needs.deploy.outputs.releasable == 'true'
    permissions:
      contents: write
      # To dispatch release.yml for the tag — see the end of the tagging step.
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 0

      # A re-run for a commit that already released is a no-op, not an error.
      - name: Check the tag is free
        id: free
        env:
          NEXT: ${{ needs.deploy.outputs.version }}
        run: |
          tag="sandbox-factory-v$NEXT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "free=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already exists; nothing to do"
          else
            echo "free=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        if: steps.free.outputs.free == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.deploy.outputs.version }}
          DEPLOYED: ${{ needs.deploy.outputs.sha }}
        run: |
          tag="sandbox-factory-v$NEXT"

          # The tag names the deployed commit itself — the sha the footer
          # reports and release.yml stamps into asset names and the
          # attestation. Do not reintroduce a `chore(release):` bump commit to
          # tag instead: the release page and attestation would then name a
          # commit the footer never shows.
          #
          # `git tag -a` records a tagger and a runner has no git identity;
          # without these two lines it dies with "empty ident name". This is
          # the identity GitHub uses for commits made by Actions.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "sandbox-factory $NEXT" "$DEPLOYED"
          git push origin "$tag"

          # The deployed sha goes in the release body, the page the footer
          # links to. Notes are generated through the API and the sha
          # prepended, because gh honours only one of --generate-notes and
          # --notes.
          prev="$(git tag -l 'sandbox-factory-v*' --sort=-v:refname | sed -n 2p)"
          generated="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" \
            -f target_commitish="$DEPLOYED" \
            ${prev:+-f previous_tag_name="$prev"} \
            --jq .body)"

          # printf, so the multi-line body needs no literal newlines inside
          # this YAML block scalar.
          body="$(printf 'Deployed commit: `%s`\n\n%s\n' "$DEPLOYED" "$generated")"

          gh release create "$tag" \
            --title "sandbox-factory: v$NEXT" \
            --target "$DEPLOYED" \
            --notes "$body"

          # release.yml must be dispatched by hand: GitHub raises no workflow
          # events for anything done with the default GITHUB_TOKEN (the rule
          # auto-merge.yml works around with AUTO_MERGE_TOKEN), so its
          # `push: tags` trigger never sees this tag and the release would
          # have no signed artifacts. `workflow_dispatch` is exempt from that
          # rule.
          gh workflow run release.yml -f tag="$tag"

          {
            echo "### Released \`$tag\`"
            echo
            echo "Deployed commit: \`$DEPLOYED\`"
          } >> "$GITHUB_STEP_SUMMARY"
