name: Deploy

# Continuous deployment: production tracks main.
#
# Triggered by the push that auto-merge.yml produces when it merges a PR on
# green. That ordering is the whole design — CI is the gate, and it has already
# run by the time this starts, so nothing here re-tests. The required checks
# named in the branch ruleset (`Test (Node 22)`, `Test (Node 24)`) remain the
# only thing standing between a PR and production.
#
# A `push` trigger rather than `workflow_run` after CI: a push to main has by
# definition already satisfied the ruleset, and workflow_run chaining is a known
# source of double-deploys and confusing reruns.
#
# That trigger only fires if the merge is made with a token other than the
# default GITHUB_TOKEN, which GitHub refuses to raise events for. See the note
# on the arming step in auto-merge.yml; without AUTO_MERGE_TOKEN configured,
# this workflow runs only when dispatched by hand.

on:
  push:
    branches: [main]
    # Documentation-only changes do not need a deploy. The SPA and API are
    # unaffected by them, and skipping saves both minutes and an invalidation.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to current HEAD)"
        required: false
        type: string

# OIDC needs id-token: write to mint the token AWS exchanges for credentials.
# The same token type is what Sigstore exchanges for a signing certificate, so
# one grant serves both; they are different audiences of the same mechanism.
#
# `attestations: write` stores the signed provenance statement. Note this is
# the only write against the repository here — `contents` stays read, so this
# workflow can attest what it builds but cannot alter what it built from.
permissions:
  contents: read
  id-token: write
  attestations: write

# Never cancel a deploy in flight: cancelling between the migration step and the
# service update would leave the schema ahead of the code. Two merges land as
# two sequential deploys instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: sandbox-factory

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Attach a GitHub Environment to require manual approval before this job
    # runs. Left unprotected at launch, which is the continuous deployment that
    # was asked for; adding a required reviewer later is a settings change, not
    # a workflow change.
    environment:
      name: production
      url: https://platform.lunox.work

    # Consumed by the `release` job below, which tags what this job verified.
    # The version is decided here, before the build, so the tag it cuts is the
    # one already compiled into the artifact that is now live.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      releasable: ${{ steps.version.outputs.releasable }}

    steps:
      # Full history and tags: the version this deploy will be released as is
      # computed from the commits since the last tag, below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve the commit being deployed
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      # No access key anywhere. The role's trust policy is scoped by `sub` to
      # this repository's main branch, so a fork or a pull request cannot assume
      # it even though they run the same workflow file.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ steps.commit.outputs.short }}

      - name: Read infrastructure configuration
        id: infra
        run: |
          # Every value CD needs comes from the live infrastructure rather than
          # being duplicated here, so renaming a resource in Terraform cannot
          # leave this workflow pointing at something that no longer exists.
          #
          # Each lookup is checked before it is written. A failed query and a
          # query that matched nothing both yield an empty string or the literal
          # "None", and neither aborts the step on its own — the failure then
          # surfaces much later as a malformed argument built from the blank,
          # such as `docker buildx --tag :<sha>` rejecting an "invalid reference
          # format". Naming the missing resource here costs one line and points
          # at the actual problem, which is that the infrastructure is not there.
          resolve() {
            local name="$1" value
            shift
            value="$("$@")" || value=""
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::could not resolve $name — is the infrastructure applied in $AWS_REGION?"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          }

          resolve ecr aws ecr describe-repositories \
            --repository-names "$PROJECT-api" \
            --query 'repositories[0].repositoryUri' --output text
          resolve bucket aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, '$PROJECT-web-')].Name | [0]" --output text
          resolve distribution aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'platform.lunox.work')].Id | [0]" --output text

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The version this deploy will be released as — computed BEFORE the build,
      # not after it.
      #
      # Every merge to main that carries a releasable commit becomes a release,
      # and the `release` job below cuts the tag once this deploy has verified
      # itself against the live site. That ordering is deliberate: a tag means
      # "this ran in production", so it cannot be created first.
      #
      # But the artifact has to *know* the version and tag it is about to become,
      # because both are compiled into the bundle. Resolving them afterwards
      # would ship a bundle reporting the previous version and a `main` ref,
      # and releaseUrl() in packages/shared would then return undefined for a
      # build that genuinely is a release — the footer would link to the commit
      # and not to the release page that exists for it.
      #
      # So the version is decided here and the tag is a promise kept below. If
      # the deploy fails, no tag is created and the bundle carrying that version
      # was never published, so nothing outside this run ever saw the claim.
      - name: Work out the version being released
        id: version
        run: |
          # The base version comes from the last tag, not package.json.
          #
          # The tag is cut on the deployed commit, so nothing bumps package.json
          # as part of a release any more. That makes package.json a record of
          # the last manual version change rather than the released one — using
          # it as the base would recompute the same number every deploy and try
          # to create a tag that already exists.
          #
          # The tags are the release history, so they are the source of truth.
          # `--sort=-v:refname` orders them semantically: v1.10.0 above v1.9.0.
          last="$(git tag -l 'sandbox-factory-v*' --sort=-v:refname | head -1)"
          echo "last release: ${last:-<none>}"

          # Strip the component prefix back to a bare semver. With no tags at
          # all, fall back to package.json — a first release has no history.
          if [[ -n "$last" ]]; then
            current="${last#sandbox-factory-v}"
          else
            current="$(node -p "require('./package.json').version")"
          fi
          echo "base version: $current"

          # Exit 1 means nothing in the range warrants a release — a docs-only
          # or chore-only merge. The deploy still happens; it just ships as the
          # current version and the `release` job below cuts no tag.
          if next="$(node scripts/next-version.mjs --from "$last" --to HEAD --current "$current")"; then
            echo "value=$next" >> "$GITHUB_OUTPUT"
            echo "ref=sandbox-factory-v$next" >> "$GITHUB_OUTPUT"
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            echo "this deploy releases $current -> $next"
          else
            echo "value=$current" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "nothing releasable; deploying as $current without a tag"
          fi

      # ---- build the SPA ---------------------------------------------------

      # BUILD_SHA is not cosmetic here. apps/web/vite.config.ts compiles it into
      # the bundle, and the verification step at the end reads it back off the
      # live site to prove this exact build is serving.
      #
      # BUILD_VERSION is set explicitly, to the version this deploy is being
      # released as. It used to be left unset so the resolver would fall back to
      # packages/core/package.json — correct only while a separate step wrote
      # the released number into the tree. Nothing writes it now, so the
      # fallback would report the version of the *last manual* bump for a build
      # that is about to become a new release.
      #
      # Passing the short sha here was a different bug, fixed earlier: it made
      # the sha appear twice, since formatVersion appends it as semver build
      # metadata (`cd09b15+cd09b15`). A semver version is the right value.
      #
      # BUILD_REF carries the tag rather than `main` when this deploy releases,
      # which is what releaseUrl() matches on to offer the release link.
      - name: Build the web app
        env:
          BUILD_SHA: ${{ steps.commit.outputs.sha }}
          BUILD_REF: ${{ steps.version.outputs.ref }}
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npx turbo run build --filter=@sandbox-factory/web
          if ! grep -qF "$BUILD_SHA" apps/web/dist/assets/*.js; then
            echo "::error::the bundle does not contain $BUILD_SHA — provenance is not reaching the artifact"
            exit 1
          fi
          echo "ok: the bundle records $BUILD_SHA"

      # ---- build and push the API image ------------------------------------

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # ARM64 to match the Fargate runtime platform. A mismatch is not caught at
      # build time — it surfaces as "exec format error" when the task starts.
      # Whether this commit's image is already in the registry.
      #
      # The repository is IMMUTABLE, so pushing a tag that exists is an error
      # rather than a no-op. That is the right setting — it means a deployed sha
      # always names the exact bytes that were deployed — but it makes re-running
      # a deploy for the same commit fail on a step that already succeeded, which
      # is exactly what a `workflow_dispatch` retry does after a later step
      # failed. Skipping the build in that case makes a redeploy idempotent
      # without weakening the guarantee: the image for this sha exists, and no
      # other image could have that tag.
      - name: Check whether the image already exists
        id: image
        run: |
          if aws ecr describe-images \
               --repository-name "$PROJECT-api" \
               --image-ids "imageTag=${{ steps.commit.outputs.sha }}" \
               >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "image for ${{ steps.commit.outputs.sha }} is already in ECR; skipping the build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the API image
        id: build
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.infra.outputs.ecr }}:${{ steps.commit.outputs.sha }}
          # The same three values the web bundle was built with, so /version and
          # the footer report one build rather than two that disagree about
          # which ref they came from.
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_SHA=${{ steps.commit.outputs.sha }}
            BUILD_REF=${{ steps.version.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest of what is about to run in production, however we got here.
      #
      # This depends on the build being single-platform. `platforms:
      # linux/arm64` above produces one image manifest, so the digest pushed to
      # ECR is the digest the runtime resolves and reports back as `ImageID` —
      # which is what makes the check at the end of this workflow, and
      # the attestation lookup by digest, line up. Adding a second platform
      # would push a manifest *list* whose digest is not the digest of either
      # image inside it, and the lookup would start missing against a perfectly
      # good deployment. Attest the per-platform digest if that day comes.
      #
      # Two paths reach this point: a fresh build, which reports its digest as a
      # step output, and a redeploy of a commit whose image is already in ECR,
      # which skipped the build entirely. The second still needs the digest —
      # it is what the deployment is verified against below — so it is read back
      # from the registry. Taking it from `docker/build-push-action` only would
      # leave every redeploy unable to verify itself.
      - name: Resolve the image digest
        id: digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="$(aws ecr describe-images \
              --repository-name "$PROJECT-api" \
              --image-ids "imageTag=${{ steps.commit.outputs.sha }}" \
              --query 'imageDetails[0].imageDigest' --output text)"
          fi
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            echo "::error::could not determine the image digest for ${{ steps.commit.outputs.sha }}"
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          echo "Image digest: $digest"

      # What makes a deployed image verifiable rather than merely labelled.
      #
      # Until now only tagged releases were attested, by release.yml — and those
      # artifacts are not what runs in production. This signs the actual
      # deployed image: this digest, built by this workflow, from this commit,
      # recorded in a public transparency log. Anyone holding the digest can
      # then check it without trusting us or this pipeline:
      #
      #   gh api /repos/lunox-work/sandbox-factory/attestations/sha256:...
      #
      # The API publishes that digest at GET /version, read from the container
      # runtime rather than from a build argument, which is what closes the loop
      # from "the server claims a commit" to "these bytes provably came from
      # that commit". See apps/api/src/image-digest.ts and docs/versioning.md.
      #
      # Skipped on a redeploy: the attestation is bound to the digest, and the
      # digest has not changed, so the existing one still verifies. Re-signing
      # would add a second attestation for identical bytes and prove nothing new.
      - name: Attest the deployed image
        if: steps.image.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.infra.outputs.ecr }}
          subject-digest: ${{ steps.digest.outputs.value }}
          # Stored in the repository's attestation store rather than pushed to
          # ECR. `push-to-registry` would need the referrers API and an extra
          # ECR write on this role, and buys nothing here: the statement is
          # fetchable by digest from the repository's attestation endpoint, so
          # a verifier needs no access to a private registry they cannot pull
          # from anyway.
          push-to-registry: false

      # ---- migrate, then deploy --------------------------------------------

      # Order matters and is not arbitrary. Migrations run first, so a new task
      # never starts against a schema older than the code expects. This assumes
      # backward-compatible migrations — expand then contract — which the
      # existing trigger-based ones already follow.
      - name: Register the task definition
        id: taskdef
        run: |
          current="$(aws ecs describe-task-definition \
            --task-definition "$PROJECT-api" \
            --query 'taskDefinition' --output json)"

          # Swap the image and BUILD_SHA, drop the read-only fields AWS returns
          # but rejects on register, and keep everything else as Terraform set it.
          echo "$current" | jq \
            --arg img "${{ steps.infra.outputs.ecr }}:${{ steps.commit.outputs.sha }}" \
            --arg sha "${{ steps.commit.outputs.sha }}" '
              .containerDefinitions[0].image = $img
              | .containerDefinitions[0].environment =
                  ((.containerDefinitions[0].environment // [])
                   | map(select(.name != "BUILD_SHA"))
                   + [{name: "BUILD_SHA", value: $sha}])
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            ' > taskdef.json

          arn="$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Registered $arn"

      # Against Neon, over the public internet, from a task in a public subnet.
      # Neon suspends after ~5 minutes idle, so the first connection may wait a
      # few hundred milliseconds while it wakes — the migration runner's own
      # timeout covers that.
      - name: Run database migrations
        run: |
          subnets="$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=$PROJECT-public-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')"
          sg="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$PROJECT-tasks" \
            --query 'SecurityGroups[0].GroupId' --output text)"

          SUBNETS="$subnets" SECURITY_GROUP="$sg" \
            ./infra/scripts/run-migrations.sh "${{ steps.commit.outputs.sha }}"

      - name: Update the ECS service
        run: |
          aws ecs update-service \
            --cluster "$PROJECT" \
            --service "$PROJECT-api" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --query 'service.serviceName' --output text

          echo "Waiting for the service to stabilise..."
          # The deployment circuit breaker rolls back automatically if the new
          # tasks fail to start, so a timeout here means the rollback already
          # happened. With no load balancer there is no target-group draining to
          # wait on: ECS deregisters the old task from Service Discovery and the
          # 15-second record TTL carries the rest.
          aws ecs wait services-stable \
            --cluster "$PROJECT" \
            --services "$PROJECT-api"

      # ---- publish the SPA -------------------------------------------------

      # After the API, so the browser never receives a bundle that calls an
      # endpoint which is not deployed yet.
      - name: Publish the web app
        run: |
          # New assets first, and deliberately WITHOUT --delete. The previous
          # index.html is still the document being served at this moment, and
          # it references the previous hashes; deleting them here would 404
          # every asset for anyone who loads the old document in the seconds
          # before the new one goes up. Hashed filenames make adding safe —
          # nothing collides.
          aws s3 sync apps/web/dist "s3://${{ steps.infra.outputs.bucket }}" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          # Then flip the document. Uncached, so the next request gets the new
          # one, which points at the assets uploaded above.
          aws s3 cp apps/web/dist/index.html "s3://${{ steps.infra.outputs.bucket }}/index.html" \
            --cache-control "no-cache, must-revalidate"

          # Prune assets that no recent build produced — with a grace period,
          # because flipping index.html does not retire the documents already
          # open in people's browsers. A tab holding the previous index.html
          # can still request a lazy-loaded chunk hours later, and deleting
          # immediately would 404 it.
          #
          # Two earlier attempts were wrong in opposite directions. A lifecycle
          # rule expiring assets/ by age would eventually delete the *live*
          # bundle during a quiet month. Deleting everything not in this build
          # broke the tabs above. This deletes only objects that are both
          # absent from the current build and older than the grace period, so
          # the live set is never a candidate and a stale tab has a day to
          # finish what it is doing.
          GRACE_HOURS=24
          cutoff_epoch="$(( $(date -u +%s) - GRACE_HOURS * 3600 ))"

          # Age is compared here rather than in a --query filter. JMESPath
          # defines its ordering operators for numbers only, so `LastModified
          # <= '<string>'` is specified to evaluate to null and drop every
          # element — silently, which would turn this whole step into a no-op
          # that prunes nothing and reports success. Some CLI builds are more
          # forgiving than the spec; relying on that is not worth it when the
          # failure mode is invisible.
          keep="$(cd apps/web/dist && find assets -type f | sort)"

          aws s3api list-objects-v2 \
            --bucket "${{ steps.infra.outputs.bucket }}" \
            --prefix assets/ \
            --query 'Contents[].[Key,LastModified]' \
            --output text \
          | while read -r key modified; do
              [ -z "$key" ] || [ "$key" = "None" ] && continue
              # date(1) differs between GNU and BSD; the runner is Linux, and
              # this is the GNU form.
              age_epoch="$(date -u -d "$modified" +%s 2>/dev/null)" || continue
              [ "$age_epoch" -le "$cutoff_epoch" ] && echo "$key"
            done | sort > /tmp/old-assets.txt

          comm -13 <(echo "$keep") /tmp/old-assets.txt | while read -r stale; do
            [ -z "$stale" ] && continue
            echo "pruning $stale (absent from this build, older than ${GRACE_HOURS}h)"
            aws s3 rm "s3://${{ steps.infra.outputs.bucket }}/$stale"
          done

      - name: Invalidate the CDN
        run: |
          # Only index.html needs invalidating; every other file has a new name.
          # Invalidating /* would be slower and, past 1,000 paths a month, billed.
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.distribution }}" \
            --paths "/index.html" "/" \
            --query 'Invalidation.Id' --output text

      # ---- prove it ---------------------------------------------------------

      # The digest is passed as well as the sha, so this checks the bytes running
      # and not only the label they carry. See the header of verify-deploy.sh
      # for why those are different claims.
      - name: Verify the deployment
        run: |
          ./infra/scripts/verify-deploy.sh \
            "${{ steps.commit.outputs.sha }}" \
            "https://platform.lunox.work" \
            "${{ steps.digest.outputs.value }}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deployment ${{ job.status }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ steps.commit.outputs.short }}\` |"
            echo "| URL | https://platform.lunox.work |"
            echo "| Image | \`${{ steps.commit.outputs.sha }}\` |"
            echo "| Digest | \`${{ steps.digest.outputs.value }}\` |"
            echo
            echo "Fetch this deployment's signed provenance, without trusting this run:"
            echo
            echo '```'
            echo "gh api /repos/${{ github.repository }}/attestations/${{ steps.digest.outputs.value }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- tag what just shipped ---------------------------------------------
  #
  # Runs only after the deploy verified against the live site, so a tag means
  # "this ran in production and answered for itself", not "this merged". A
  # failed deploy leaves no release, which is the whole point of the ordering:
  # the release page and the running site cannot disagree.
  #
  # The version is not recomputed here — it is the one `deploy` decided before
  # it built, and therefore the one compiled into the bundle now serving.
  # Recomputing would risk a different answer (a tag created meanwhile, a race
  # with another merge) and the tag would then name a version no artifact
  # reports.
  #
  # Separate from `deploy` because it needs `contents: write` to create the tag,
  # and the deploy job holds AWS credentials. Keeping them apart means the job
  # that can write to the repository cannot touch production, and the job that
  # can touch production cannot rewrite history — the same split release.yml
  # makes between signing and uploading.
  release:
    name: Tag the release
    needs: deploy
    runs-on: ubuntu-latest
    # A push to main that carried something releasable.
    #
    # workflow_dispatch is excluded: a redeploy of an older commit must not tag,
    # because the version was computed against the previous tag and main has
    # already moved past it — the release would sit behind HEAD while claiming
    # to be the latest.
    if: github.event_name == 'push' && needs.deploy.outputs.releasable == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 0

      # A re-run of this workflow for a commit that already released should be a
      # no-op, not an error.
      - name: Check the tag is free
        id: free
        env:
          NEXT: ${{ needs.deploy.outputs.version }}
        run: |
          tag="sandbox-factory-v$NEXT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "free=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already exists; nothing to do"
          else
            echo "free=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        if: steps.free.outputs.free == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.deploy.outputs.version }}
          DEPLOYED: ${{ needs.deploy.outputs.sha }}
        run: |
          tag="sandbox-factory-v$NEXT"

          # The tag names the commit that was built and deployed — the same sha
          # the footer reports, the same sha release.yml stamps into the asset
          # names and the provenance attestation.
          #
          # This used to bump package.json on main in a `chore(release):` commit
          # and tag that instead, one above the deployed commit. That kept
          # package.json-at-the-tag correct, at the cost of three shas for one
          # release: the footer quoted the deployed commit while the release
          # page and every asset named the bump. Someone clicking `release` in
          # the footer landed on a page naming a commit they had never seen, and
          # verifying provenance against the footer's sha found an attestation
          # for a different one.
          #
          # Nothing bumps package.json now, so it no longer tracks the released
          # version — the tags do, and the deploy job reads the base version back
          # from the last tag. That is what stops dropping the bump from making
          # the next run recompute the same number.
          git tag -a "$tag" -m "sandbox-factory $NEXT" "$DEPLOYED"
          git push origin "$tag"

          # The deployed sha goes in the release body, not only the run summary.
          # The body is the page the footer link lands on, and the point of this
          # change is that the sha quoted there is the one the reader arrived
          # with.
          #
          # Notes are generated through the API and the sha prepended, rather
          # than passing --generate-notes and --notes together: gh honours one
          # and drops the other, costing either the changelog or the sha.
          prev="$(git tag -l 'sandbox-factory-v*' --sort=-v:refname | sed -n 2p)"
          generated="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" \
            -f target_commitish="$DEPLOYED" \
            ${prev:+-f previous_tag_name="$prev"} \
            --jq .body)"

          # printf, because a literal blank line inside this YAML block scalar
          # would end the script.
          body="$(printf 'Deployed commit: `%s`\n\n%s\n' "$DEPLOYED" "$generated")"

          gh release create "$tag" \
            --title "sandbox-factory: v$NEXT" \
            --target "$DEPLOYED" \
            --notes "$body"

          {
            echo "### Released \`$tag\`"
            echo
            echo "Deployed commit: \`$DEPLOYED\`"
          } >> "$GITHUB_STEP_SUMMARY"
