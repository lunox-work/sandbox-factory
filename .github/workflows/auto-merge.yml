name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

# pull_request_target runs with write access to the base repository, so this
# workflow never checks out or executes PR code — it only calls the GitHub API.
# Keep it that way: checking out the head ref here would let any fork's PR run
# code with these permissions.
permissions:
  contents: read

jobs:
  auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
      github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The only source of Dependabot's update-type; the merge step reads it.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `--auto` merges once eligible (possibly immediately if already green).
      # Nothing here bypasses the branch ruleset.
      #
      # AUTO_MERGE_TOKEN, not GITHUB_TOKEN: GitHub raises no events for pushes
      # made with the default token, so a squash-merge armed with it lands on
      # main without triggering ci.yml or cd.yml, and nothing deploys. A token
      # from another identity makes the merge an ordinary push.
      #
      # Fail closed if the event-producing token is unavailable. A merge that
      # silently suppresses CD is not a successful ship.
      - name: Arm auto-merge
        # Everything merges on green except a Dependabot major — that is where
        # breaking changes live, so it waits for a human.
        if: |
          github.event.pull_request.user.login != 'dependabot[bot]' ||
          steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ] || ! gh pr view "$PR_URL" --json number >/dev/null 2>&1; then
            echo "::error::AUTO_MERGE_TOKEN missing or unusable. Rotate it; no fallback merge will suppress CD."
            exit 1
          fi

          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
