name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Maintains a release PR that accumulates changelog entries from
      # Conventional Commits. Merging it tags the release.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # Stay pre-1.0 until the public API is real; 1.0.0 would signal a
          # stability commitment the placeholder API cannot back.
          initial-version: 0.1.0
