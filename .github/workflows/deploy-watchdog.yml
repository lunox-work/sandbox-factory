name: Deploy watchdog

# Catches the silent failure: main moves, production does not.
#
# The main cause is AUTO_MERGE_TOKEN expiring. auto-merge.yml then falls back to
# GITHUB_TOKEN, GitHub raises no push event for that merge, and cd.yml never
# fires — PRs merge, checks pass, nothing deploys, nothing errors.
#
# So this compares the commit production serves with the head of main. It reads
# the live site rather than workflow history, so it also catches a rolled-back
# deploy, a stalled service and a CD run that reported success without taking
# effect. CloudWatch cannot do this: it sees only the AWS side.

on:
  schedule:
    # 09:00 UTC daily. A deploy lag is not an outage, so this wants a
    # working-hours signal, not a page at 3am.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-watchdog
  cancel-in-progress: true

jobs:
  check:
    name: Compare production against main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ask production which commit it is running
        id: live
        run: |
          set -euo pipefail

          # /version is unauthenticated and CachingDisabled at the CDN, so this
          # reads the running process rather than an edge cache.
          if ! body="$(curl -fsS --max-time 20 https://platform.lunox.work/version)"; then
            echo "unreachable=true" >> "$GITHUB_OUTPUT"
            echo "Could not reach /version." >&2
            exit 0
          fi

          sha="$(printf '%s' "$body" | jq -r '.gitSha // empty')"
          if [ -z "$sha" ]; then
            echo "unreachable=true" >> "$GITHUB_OUTPUT"
            echo "No gitSha in /version response." >&2
            exit 0
          fi

          echo "unreachable=false" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Production reports $sha"

      - name: Work out how far behind production is
        id: drift
        if: steps.live.outputs.unreachable != 'true'
        run: |
          set -euo pipefail

          live="${{ steps.live.outputs.sha }}"
          head="$(git rev-parse HEAD)"

          if [ "$live" = "$head" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Production is at main's HEAD."
            exit 0
          fi

          # Only a *deployable* commit that never shipped is a problem, so
          # docs-only commits are excluded exactly as cd.yml's paths-ignore
          # excludes them.
          if ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production reports $live, which is not a commit in this repository."
            exit 0
          fi

          deployable="$(git log --format=%H "$live..$head" -- \
            . ':(exclude)*.md' ':(exclude)docs' ':(exclude).github/ISSUE_TEMPLATE' \
            | wc -l | tr -d ' ')"

          if [ "$deployable" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Behind HEAD, but only by commits CD ignores."
            exit 0
          fi

          # Age matters more than count: one commit unshipped for three days is
          # the token failure; six shipped an hour ago is a busy afternoon.
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct "$live") ) / 86400 ))

          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "count=$deployable" >> "$GITHUB_OUTPUT"
          echo "age_days=$age_days" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Open or update an issue
        if: steps.drift.outputs.stale == 'true' && steps.drift.outputs.age_days >= 1
        uses: actions/github-script@v9
        env:
          LIVE: ${{ steps.drift.outputs.live }}
          HEAD_SHA: ${{ steps.drift.outputs.head }}
          COUNT: ${{ steps.drift.outputs.count }}
          AGE: ${{ steps.drift.outputs.age_days }}
        with:
          script: |
            const { LIVE, HEAD_SHA, COUNT, AGE } = process.env;
            const title = 'Production is behind main';
            const body = [
              `Production is running \`${LIVE.slice(0, 7)}\`, which is **${COUNT} deployable commit(s)** behind \`main\` (\`${HEAD_SHA.slice(0, 7)}\`). The deployed commit is ${AGE} day(s) old.`,
              '',
              'The most likely cause is **`AUTO_MERGE_TOKEN` having expired**. `auto-merge.yml` falls back to `GITHUB_TOKEN` when it cannot use the secret, and GitHub raises no push event for a merge made with the default token — so PRs merge, every check stays green, and `cd.yml` never fires.',
              '',
              'To confirm and fix:',
              '',
              '1. Check a recent merge actually triggered CD: `gh run list --workflow=cd.yml --limit 5`',
              '2. Look for the fallback warning in a recent auto-merge run.',
              '3. Rotate the token: `./scripts/rotate-token.sh`',
              '4. Deploy the backlog: `gh workflow run cd.yml`',
              '',
              'Other causes worth ruling out: a CD run that failed, or a deployment rolled back by the ECS circuit breaker.',
              '',
              '_Opened automatically by `deploy-watchdog.yml`. It updates this issue rather than opening another, and you can close it once production catches up._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-watchdog',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still behind: \`${LIVE.slice(0, 7)}\`, ${COUNT} commit(s) and ${AGE} day(s) old.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deploy-watchdog'],
              });
            }

      - name: Close the issue once production catches up
        if: steps.drift.outputs.stale != 'true' && steps.live.outputs.unreachable != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-watchdog',
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Production has caught up with `main`. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail the run when production is unreachable
        if: steps.live.outputs.unreachable == 'true'
        run: |
          echo "::error::Could not read /version from production."
          exit 1
