name: CodeQL autofix

# When a PR's CodeQL check fails, ask CodeRabbit to push a fix to that branch.
#
# This is the one piece of this setup that writes code without being asked, so
# it is deliberately narrow: it fires only on a *failed CodeQL check* for an
# open PR, and it comments rather than committing anything itself. The fix
# lands on the PR branch, where the required checks still gate the merge — so
# the worst case is a bad suggestion that a human declines, not a bad fix that
# reaches `main`.

on:
  check_run:
    types: [completed]

permissions:
  contents: read

jobs:
  request-autofix:
    # `check_run` fires for every check in the repo, so filter hard and early.
    if: >-
      github.event.check_run.name == 'CodeQL' &&
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment once per PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.check_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR is $state; nothing to fix."
            exit 0
          fi

          # CodeQL re-runs on every push, so without this guard a PR that takes
          # three pushes to get green collects three identical comments.
          marker="<!-- codeql-autofix-requested -->"
          if gh pr view "$PR" --repo "$REPO" --json comments \
               --jq '.comments[].body' | grep -qF "$marker"; then
            echo "Already requested a fix on #$PR."
            exit 0
          fi

          # printf rather than a heredoc: a heredoc body inside a YAML block
          # scalar has to sit at column 0 to terminate, which breaks the YAML.
          printf '%s\n' \
            "$marker" \
            "CodeQL failed on this pull request, so it cannot merge until the alert is resolved." \
            "" \
            "@coderabbitai autofix" \
            "" \
            "Prefer a linear-time rewrite over a regex tweak, keep the behaviour identical, and add a regression test pinning the edge case. If the alert is a genuine false positive, say so here instead of changing the code — dismissing a real finding to get a green check is the failure mode this gate exists to prevent." \
            > body.md
          gh pr comment "$PR" --repo "$REPO" --body-file body.md
