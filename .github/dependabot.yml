version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-dependency bumps instead of a dozen.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Must not exceed `engines.vscode` in apps/extension, or `vsce package`
      # refuses to build the VSIX. Raise both together, by hand.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
