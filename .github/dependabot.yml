version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-dependency bumps instead of a dozen.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      # better-auth and its @better-auth/* plugins type-check only at one
      # version; bumped apart, the API's lint fails.
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
    ignore:
      # Must not exceed `engines.vscode` in apps/extension, or `vsce package`
      # refuses to build the VSIX. Raise both together, by hand.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init, autobuild, analyze and upload-sarif must share one version: a
      # PR bumping one alone fails CodeQL's Analyze job.
      codeql-action:
        patterns: ["github/codeql-action*"]

  # Base images are pinned by digest; this keeps the digests current.
  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web", "/apps/worker"]
    schedule:
      interval: weekly
